# Secret check: fails a pull request whose added lines look like a password,
# an API key or bank details. Plain regex and checksums, no third-party actions.
# To let one line through on purpose, add the words  secret-check: allow  to it.
name: secret-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan added lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" --repo "$REPO" > "$RUNNER_TEMP/pr.diff"
          python3 - "$RUNNER_TEMP/pr.diff" <<'PY'
          import re, sys

          RULES = [
              ("private key",     re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("GitHub token",    re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{60,}\b")),
              ("AWS key",         re.compile(r"\b(AKIA|ASIA)[A-Z0-9]{16}\b")),
              ("Google API key",  re.compile(r"\bAIza[0-9A-Za-z_\-]{35}\b")),
              ("Slack token",     re.compile(r"\bxox[abposr]-[A-Za-z0-9-]{10,}\b")),
              ("Stripe live key", re.compile(r"\b(sk|rk)_live_[A-Za-z0-9]{20,}\b")),
              ("AI API key",      re.compile(r"\bsk-(ant-)?[A-Za-z0-9_\-]{20,}\b")),
              ("password in text",re.compile(r"(?i)(?<![a-z])(password|passwd|pwd|pass|secret|api[_-]?key|access[_-]?token|auth[_-]?token)(?![a-z])[\"']?\s*[:=]\s*[\"']?(?!\$|os\.|process\.env|getenv|env\.|secrets\.)[^\"'\s]{8,}")),
              ("URL with password", re.compile(r"[a-z][a-z0-9+.\-]*://[^/\s:@]+:[^/\s:@]{4,}@")),
              ("UK bank account", re.compile(r"\b\d{2}-\d{2}-\d{2}\b.{0,40}?\b\d{8}\b|\b\d{8}\b.{0,40}?\b\d{2}-\d{2}-\d{2}\b")),
          ]
          IBAN = re.compile(r"\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]){11,30}\b")
          # Real card numbers: all digits, or groups of four (Amex 4-6-5) with one repeated separator.
          # The old rule allowed a separator between every digit, so SVG path coordinates tripped it (2026-10-30).
          CARD = re.compile(r"\b(?:[2-6]\d{3}([ -]?)\d{4}\1\d{4}\1\d{1,7}|3[47]\d{2}([ -]?)\d{6}\2\d{5})\b")

          def iban_ok(s):
              s = s.replace(" ", "")
              if not 15 <= len(s) <= 34:
                  return False
              n = "".join(str(int(c, 36)) for c in s[4:] + s[:4])
              return int(n) % 97 == 1

          def luhn_ok(s):
              d = [int(c) for c in s if c.isdigit()]
              if not 13 <= len(d) <= 19 or len(set(d)) == 1:
                  return False
              total = 0
              for i, x in enumerate(reversed(d)):
                  if i % 2:
                      x *= 2
                      x -= 9 if x > 9 else 0
                  total += x
              return total % 10 == 0

          hits, allowed, path, line_no, in_hunk = [], [], "?", 0, False
          for raw in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if raw.startswith("diff --git "):
                  in_hunk = False
                  continue
              if not in_hunk and raw.startswith("+++ "):
                  path = raw[4:].strip().removeprefix("b/")
                  if re.search(r"(^|/)\.env($|\.)", path):
                      hits.append(f"{path}:0: .env file")
                  continue
              m = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)", raw)
              if m:
                  line_no = int(m.group(1)) - 1
                  in_hunk = True
                  continue
              if not in_hunk:
                  continue
              if raw.startswith("-"):
                  continue
              if raw.startswith("+"):
                  line_no += 1
              elif raw.startswith(" "):
                  line_no += 1
                  continue
              else:
                  continue
              text = raw[1:]
              if "secret-check: allow" in text:
                  allowed.append(f"{path}:{line_no}")
                  continue
              found = [name for name, rx in RULES if rx.search(text)]
              if any(iban_ok(m.group(0)) for m in IBAN.finditer(text)):
                  found.append("IBAN")
              if any(luhn_ok(m.group(0)) for m in CARD.finditer(text)):
                  found.append("card number")
              for name in found:
                  hits.append(f"{path}:{line_no}: {name}")

          # Report where and what kind only, never the matched text.
          for a in allowed:
              print(f"::warning::{a}: allowed by secret-check: allow")
          for h in hits:
              print(f"::error::{h}")
          print(f"secret-check: {len(hits)} finding(s)")
          sys.exit(1 if hits else 0)
          PY
